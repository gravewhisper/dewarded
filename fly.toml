app = "dewarded"
primary_region = "sin"

[build]

[env]
  DATABASE_URL = "file:/data/dewarded.db"
  PUBLIC_URL = "https://dewarded.com"

[[mounts]]
  source = "dewarded_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
